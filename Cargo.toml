[workspace]
members = ["crates/*"]
exclude = ["upstream", "upstream-bin", "tools"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

# Test builds: the PromQL and rules tests push millions of samples through the real TSDB.
# Optimizing these crates in dev builds keeps `cargo test` fast (promql_test: ~140 s -> fast).
[profile.dev.package.tsdb]
opt-level = 2
[profile.dev.package.tsdb-format]
opt-level = 2
[profile.dev.package.chunkenc]
opt-level = 2
