# Workload "host": the Node Exporter Full setup of the Lean Sight real-workload test.
global: {scrape_interval: 15s}
scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s
    static_configs: [{targets: ['localhost:9390']}]
  - job_name: node
    static_configs: [{targets: ['localhost:9100']}]
