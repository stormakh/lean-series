# SD jobs for the end-to-end comparison. run.sh replaces @STATE@ and wraps this list as scrape_configs.
- job_name: ec2
  ec2_sd_configs:
    - {region: us-east-1, endpoint: "http://127.0.0.1:9895", access_key: AKIDE2E, secret_key: e2esecret, port: 9100}
- job_name: aws-ec2
  aws_sd_configs:
    - {role: ec2, region: us-east-1, endpoint: "http://127.0.0.1:9895", access_key: AKIDE2E, secret_key: e2esecret, port: 9101}
- job_name: lightsail
  lightsail_sd_configs:
    - {region: us-east-1, endpoint: "http://127.0.0.1:9895", access_key: AKIDE2E, secret_key: e2esecret, port: 9102}
- job_name: rds
  rds_sd_configs:
    - {region: us-east-1, endpoint: "http://127.0.0.1:9895", access_key: AKIDE2E, secret_key: e2esecret, port: 9187}
- job_name: aws-rds
  aws_sd_configs:
    - {role: rds, region: us-east-1, endpoint: "http://127.0.0.1:9895", access_key: AKIDE2E, secret_key: e2esecret, port: 9188}
- job_name: elasticache
  elasticache_sd_configs:
    - {region: us-east-1, endpoint: "http://127.0.0.1:9895", access_key: AKIDE2E, secret_key: e2esecret, port: 9121}
- job_name: ecs
  ecs_sd_configs:
    - {region: us-west-2, endpoint: "http://127.0.0.1:9895", access_key: AKIDE2E, secret_key: e2esecret, port: 9779}
- job_name: aws-msk
  aws_sd_configs:
    - {role: msk, region: region-full, endpoint: "http://127.0.0.1:9895", access_key: AKIDE2E, secret_key: e2esecret, port: 11001}
- job_name: openstack-hypervisor
  openstack_sd_configs:
    - {role: hypervisor, region: RegionOne, identity_endpoint: "http://127.0.0.1:9893/", username: admin, password: pass, domain_name: Default, project_name: admin, port: 9100}
- job_name: openstack-instance
  openstack_sd_configs:
    - {role: instance, region: RegionOne, identity_endpoint: "http://127.0.0.1:9893/", username: admin, password: pass, domain_name: Default, project_name: admin, port: 9100, all_tenants: true}
- job_name: openstack-loadbalancer
  openstack_sd_configs:
    - {role: loadbalancer, region: RegionOne, identity_endpoint: "http://127.0.0.1:9893/", username: admin, password: pass, domain_name: Default, project_name: admin, port: 9100}
- job_name: gce
  gce_sd_configs:
    - {project: test-project, zone: us-central1-a, port: 9100, tag_separator: ","}
- job_name: azure
  azure_sd_configs:
    - subscription_id: 11111111-1111-1111-1111-111111111111
      tenant_id: 00000000-0000-0000-0000-0000000000aa
      client_id: 22222222-2222-2222-2222-222222222222
      client_secret: recorded-secret
      port: 9100
      proxy_from_environment: true
- job_name: oci
  oci_sd_configs:
    - auth: api_key
      region: us-ashburn-1
      tenancy: ocid1.tenancy.oc1..test001
      user: ocid1.user.oc1..user001
      fingerprint: "aa:bb:cc:dd:ee:ff"
      key_file: "@STATE@/oci_key.pem"
      port: 9100
      proxy_url: "http://127.0.0.1:9892"
      tls_config: {ca_file: "@STATE@/ca.pem"}
