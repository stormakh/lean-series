[package]
name = "net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yaml = { path = "../yaml" }
json = { path = "../json" }
crypto = { path = "../crypto" }
flate2 = "=1.1.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# RSA PKCS#1 signing for the OAuth2 jwt-bearer grant; already in the tree as the rustls crypto provider
ring = "0.17"
