[package]
name = "tsdb-format"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tsdb_format"

[dependencies]
model = { path = "../model" }
chunkenc = { path = "../chunkenc" }
# mmap of index, chunk and head chunk files.
memmap2 = "0.9"
# fallocate and O_DIRECT (already a dependency of memmap2).
libc = "0.2"
# WAL record compression (Snappy block format).
snap = "1"
# WAL record compression (zstd), needed to read and write zstd WALs as upstream does.
zstd = { version = "0.13", default-features = false }
