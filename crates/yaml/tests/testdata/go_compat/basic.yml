
global:
  scrape_interval: 15s
  external_labels:
    monitor: codelab
    foo: bar
rule_files:
  - "first.rules"
  - "my/*.rules"
scrape_configs:
  - job_name: prometheus
    honor_labels: true
    static_configs:
      - targets: ['localhost:9090', 'localhost:9191']
        labels:
          my:   label
          your: label
    relabel_configs:
      - source_labels: [job, __meta_dns_name]
        regex: (.*)some-[regex]
        target_label: job
        replacement: foo-${1}
      - action: labeldrop
        regex: "^(.*)$"
